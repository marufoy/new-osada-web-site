<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工実績一覧 - 長田建設株式会社</title>
    <link rel="icon" type="image/png" href="/public/osda-header-logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .portfolio-page {
            padding: 120px 0 80px;
        }
        
        .portfolio-header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .portfolio-header h1 {
            font-size: 2.5rem;
            color: #224053;
            margin-bottom: 20px;
        }
        
        .portfolio-header p {
            font-size: 1.1rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .sort-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .sort-controls label {
            font-weight: 500;
            color: #224053;
        }
        
        .sort-select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            color: #224053;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .sort-select:focus {
            outline: none;
            border-color: #224053;
            box-shadow: 0 0 0 3px rgba(34, 64, 83, 0.1);
        }
        
        .sort-select:hover {
            border-color: #224053;
        }
        
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .portfolio-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .portfolio-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .portfolio-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }
        
        .portfolio-card-link {
            display: block;
            text-decoration: none;
            color: inherit;
        }
        
        .portfolio-image {
            position: relative;
            height: 250px;
            overflow: hidden;
        }
        
        .portfolio-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .portfolio-card:hover .portfolio-image img {
            transform: scale(1.05);
        }
        
        .portfolio-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
        }
        
        .portfolio-category {
            background: rgba(34, 64, 83, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .portfolio-content {
            padding: 25px;
        }
        
        .portfolio-title {
            font-size: 1.3rem;
            color: #224053;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .portfolio-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .portfolio-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #888;
        }
        
        .portfolio-date {
            font-weight: 500;
        }
        
        .portfolio-area {
            font-weight: 500;
        }
        
        .loading-message {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 1.1rem;
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 1.1rem;
        }
        
        .year-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .year-button {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            color: #224053;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .year-button:hover,
        .year-button.active {
            background: #224053;
            color: white;
            border-color: #224053;
        }
        
        @media (max-width: 768px) {
            .portfolio-page {
                padding: 100px 0 60px;
            }
            
            .portfolio-header h1 {
                font-size: 2rem;
            }
            
            .sort-controls {
                flex-direction: column;
                gap: 15px;
            }
            
            .portfolio-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .portfolio-content {
                padding: 20px;
            }
        }
    </style>
    <script src="https://unpkg.com/scrollreveal@4.0.9/dist/scrollreveal.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <img src="public/osda-header-logo.png" alt="長田建設" class="logo">
            <ul class="nav-menu">
                <li><a href="index.html">ホーム</a></li>
                <li><a href="company.html">会社概要</a></li>
                <li><a href="services.html">事業内容</a></li>
                <li><a href="recruit.html">採用情報</a></li>
                <li><a href="contact.html">お問合せ</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Page Hero -->
    <section class="page-hero">
        <div class="page-hero-background">
            <img src="public/construction-site-2733678_1280.jpg" alt="施工実績">
        </div>
        <div class="page-hero-content">
            <h1 class="page-hero-title">PORTFOLIO</h1>
            <p class="page-hero-subtitle">施工実績一覧</p>
        </div>
    </section>

    <!-- Breadcrumb -->
    <section class="breadcrumb-section">
        <div class="container">
            <nav class="breadcrumb">
                <a href="index.html">ホーム</a>
                <span class="breadcrumb-separator">></span>
                <a href="services.html">事業内容</a>
                <span class="breadcrumb-separator">></span>
                <span class="breadcrumb-current">施工実績一覧</span>
            </nav>
        </div>
    </section>

    <!-- Portfolio Page Content -->
    <section class="portfolio-page">
        <div class="container">
            <div class="portfolio-header">
                <h1>施工実績一覧</h1>
                <p>これまでに手がけた代表的なプロジェクトをご紹介します。住宅から大型商業施設まで、幅広い分野での豊富な実績があります。</p>
            </div>

            <!-- Sort Controls -->
            <div class="sort-controls">
                <label for="sort-select">並び順:</label>
                <select id="sort-select" class="sort-select">
                    <option value="newest">新しい順</option>
                    <option value="oldest">古い順</option>
                    <option value="title">タイトル順</option>
                </select>
            </div>

            <!-- Year Filter -->
            <div class="year-filter" id="year-filter">
                <button class="year-button active" data-year="all">すべて</button>
                <!-- Year buttons will be generated by JavaScript -->
            </div>

            <!-- Portfolio Grid -->
            <div class="portfolio-grid" id="portfolio-grid-container">
                <div class="loading-message">実績を読み込んでいます...</div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="api-fetch.js"></script>
    <script src="main.js"></script>
    <script src="portfolio.js"></script>
</body>
</html>
